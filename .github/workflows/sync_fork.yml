name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天 UTC 午夜执行，实际启动时间可能延迟
    workflow_dispatch:

concurrency:
    group: fork-sync-main
    cancel-in-progress: false

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v5
              with:
                ref: main
                fetch-depth: 0

            # GITHUB_TOKEN 无法修改 workflow 文件；保留本仓库的工作流，
            # 仅同步其余代码。上游工作流更新需要单独人工审核和同步。
            - name: Sync upstream code and preserve local workflows
              run: bash .github/scripts/sync-upstream.sh
